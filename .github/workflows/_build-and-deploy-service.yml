name: Reusable service build and deploy

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      context:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      compose_service:
        required: false
        type: string
        default: ""
      image_env:
        required: false
        type: string
        default: ""
      container_suffix:
        required: false
        type: string
        default: ""

env:
  # Scoped to this repo (not just the owner) - simulator112 and lct-simulator112 share the
  # same owner and 8/10 service names, and GHCR packages are locked to whichever repo created
  # them first. ghcr.io/<owner>/<image> would collide with simulator112's already-existing
  # packages and fail to push (denied: permission_denied: write_package).
  IMAGE_REGISTRY: ghcr.io/${{ github.repository }}
  IMAGE_TAG: ${{ github.ref_name }}-${{ github.sha }}
  COMPOSE_PROJECT: sim112-stable

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push service image
        if: inputs.image != 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ inputs.image }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REGISTRY }}/${{ inputs.image }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ inputs.image }}-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}-${{ github.ref_name }}

      - name: Build and push frontend image
        if: inputs.image == 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          build-args: |
            PUBLIC_API_ENDPOINT=http://${{ env.COMPOSE_PROJECT }}-gateway:8080
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ inputs.image }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REGISTRY }}/${{ inputs.image }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ inputs.image }}-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}-${{ github.ref_name }}

  deploy:
    # Single environment: only main deploys, to the sim112-stable stack.
    if: inputs.compose_service != '' && github.ref_name == 'main'
    needs: build
    runs-on: [self-hosted, simulator112]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Restore deployment secrets
        shell: bash
        run: |
          mkdir -p secrets
          cp ~/lct-simulator112-secrets/secrets/private.pem secrets/private.pem
          cp ~/lct-simulator112-secrets/secrets/public.pem secrets/public.pem
          cp ~/lct-simulator112-secrets/prod/.env prod/.env

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select immutable service image
        shell: bash
        run: |
          image="${IMAGE_REGISTRY}/${{ inputs.image }}:${IMAGE_TAG}"
          echo "DEPLOY_IMAGE=$image" >> "$GITHUB_ENV"
          echo "${{ inputs.image_env }}=$image" >> "$GITHUB_ENV"

      - name: Pull service image
        run: docker pull "$DEPLOY_IMAGE"

      - name: Deploy only ${{ inputs.compose_service }}
        run: >-
          docker compose
          -p "$COMPOSE_PROJECT"
          --env-file prod/.env
          -f prod/docker-compose.yml
          up -d --no-deps --no-build ${{ inputs.compose_service }}

      - name: Wait for service health
        shell: bash
        run: |
          container="${COMPOSE_PROJECT}-${{ inputs.container_suffix }}"
          for i in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Status}}' "$container" 2>/dev/null || true)
            health=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$container" 2>/dev/null || true)
            if [ "$state" = "running" ] && { [ -z "$health" ] || [ "$health" = "healthy" ]; }; then
              docker ps --filter "name=^/${container}$"
              exit 0
            fi
            if [ "$state" = "exited" ] || [ "$health" = "unhealthy" ]; then
              break
            fi
            sleep 5
          done
          echo "::error::$container did not become healthy (state=$state, health=$health)"
          docker logs --tail 100 "$container" || true
          exit 1

      - name: Prune old images
        if: always()
        run: docker image prune -af
