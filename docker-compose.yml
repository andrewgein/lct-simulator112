
x-host-gateway: &host-gateway
  - "host.docker.internal:host-gateway"

x-healthcheck-java: &healthcheck-java
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 40s

services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  jwt-keys:
    image: alpine/openssl
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        [ -f /keys/private.pem ] || {
          openssl genrsa -out /keys/private.pem 2048 &&
          openssl rsa -in /keys/private.pem -pubout -out /keys/public.pem
        }
    volumes:
      - jwt_keys:/keys

  auth-service:
    build:
      context: backend
      dockerfile: auth-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/auth
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_PRIVATE_KEY_PATH: file:/run/secrets/private.pem
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:4321}
    volumes:
      - jwt_keys:/run/secrets:ro
    depends_on:
      jwt-keys:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  classifier-service:
    build:
      context: backend
      dockerfile: classifier-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/classifier
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-java
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health | grep -q '\"status\":\"UP\"'"]

  incident-service:
    build:
      context: backend
      dockerfile: incident-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/incident
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      CLASSIFIER_GRPC_HOST: classifier-service
      CLASSIFIER_GRPC_PORT: 9093
      OLLAMA_CHAT_URL: http://${OLLAMA_SERVER_TAILSCALE_HOST:-host.docker.internal}:11434/api/chat
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
    extra_hosts: *host-gateway
    depends_on:
      postgres:
        condition: service_healthy
      classifier-service:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-java
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health | grep -q '\"status\":\"UP\"'"]

  course-service:
    build:
      context: backend
      dockerfile: course-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/course
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REVIEW_GRPC_HOST: review-service
      REVIEW_GRPC_PORT: 9092
      INCIDENT_GRPC_HOST: incident-service
      INCIDENT_GRPC_PORT: 9091
      CLASSIFIER_GRPC_HOST: classifier-service
      CLASSIFIER_GRPC_PORT: 9093
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: course-materials
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
    depends_on:
      postgres:
        condition: service_healthy
      incident-service:
        condition: service_healthy
      classifier-service:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-java
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/actuator/health | grep -q '\"status\":\"UP\"'"]

  context-service:
    build:
      context: backend
      dockerfile: context-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/context
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      INCIDENT_SERVICE_GRPC_TARGET: static://incident-service:9091
      COURSE_SERVICE_GRPC_TARGET: static://course-service:9095
      REVIEW_SERVICE_GRPC_TARGET: static://review-service:9092
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      incident-service:
        condition: service_healthy
      course-service:
        condition: service_healthy
      review-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-java
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep -q '\"status\":\"UP\"'"]

  review-service:
    build:
      context: backend
      dockerfile: review-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/review
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GRPC_SERVER_PORT: 9092
      COURSE_GRPC_HOST: course-service
      COURSE_GRPC_PORT: 9095
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_RECORDINGS_BUCKET: call-recordings
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_MODEL: ${LLM_MODEL}
      MLSERVER_URL: ${MLSERVER_URL:-http://host.docker.internal:8080}
      MLSERVER_MODEL_NAME: ${MLSERVER_MODEL_NAME:-review-model}
    extra_hosts: *host-gateway
    depends_on:
      postgres:
        condition: service_healthy
      incident-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
      course-service:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-java
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health | grep -q '\"status\":\"UP\"'"]

  profile-service:
    build:
      context: backend
      dockerfile: profile-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/profile
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      CLASSIFIER_GRPC_HOST: classifier-service
      CLASSIFIER_GRPC_PORT: 9093
    depends_on:
      postgres:
        condition: service_healthy
      classifier-service:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-java
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"'"]

  notification-service:
    build:
      context: backend
      dockerfile: notification-service/Dockerfile
    environment:
      SERVER_PORT: 8087
      DB_URL: jdbc:postgresql://postgres:5432/notification
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:4321}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-java
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health | grep -q '\"status\":\"UP\"'"]

  dialog-service:
    build:
      context: backend/dialog-service
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_MODEL: ${LLM_MODEL}
      CONTEXT_SOURCE: grpc
      CONTEXT_MANAGER_GRPC_URL: context-service:9090
      F5_TTS_BASE_URL: http://${TTS_SERVER_TAILSCALE_HOST:-host.docker.internal}:8888
      TTS_MAX_GENERATION_TOKENS: 512
      TTS_TEMPERATURE: 0.7
      TTS_STRESS_MODE: all
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_RECORDINGS_BUCKET: call-recordings
    extra_hosts: *host-gateway
    depends_on:
      context-service:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8005/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s

  admin-service:
    build:
      context: backend
      dockerfile: admin-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/admin
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BACKUP_BUCKET: backups
      BACKUP_SECRETS_DIR: /run/secrets/all
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-local-dev-key}
      GATEWAY_INTERNAL_URL: http://api-gateway:8080
      AUTH_SERVICE_URL: http://auth-service:8081
      DIALOG_SERVICE_INTERNAL_URL: http://dialog-service:8005
    volumes:
      - jwt_keys:/run/secrets/all:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-java
      test: ["CMD-SHELL", "wget -qO- http://localhost:8089/actuator/health | grep -q '\"status\":\"UP\"'"]

  api-gateway:
    build:
      context: backend/api-gateway
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      INCIDENT_SERVICE_URL: http://incident-service:8086
      COURSE_SERVICE_URL: http://course-service:8088
      CONTEXT_MANGER_URL: http://context-service:8084
      REVIEW_SERVICE_URL: http://review-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
      PROFILE_SERVICE_URL: http://profile-service:8082
      CLASSIFIER_SERVICE_URL: http://classifier-service:8087
      ADMIN_SERVICE_URL: http://admin-service:8089
      DIALOG_SERVICE_URL: ws://dialog-service:8005
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_PUBLIC_KEY_PATH: file:/run/secrets/public.pem
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      RATE_LIMIT_REPLENISH: ${RATE_LIMIT_REPLENISH:-200}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-400}
    volumes:
      - jwt_keys:/run/secrets:ro
    depends_on:
      jwt-keys:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
      incident-service:
        condition: service_started
      course-service:
        condition: service_started
      context-service:
        condition: service_started
      review-service:
        condition: service_started
      notification-service:
        condition: service_started
      profile-service:
        condition: service_started
      classifier-service:
        condition: service_started
      admin-service:
        condition: service_started
      dialog-service:
        condition: service_started
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  frontend:
    build:
      context: frontend
      args:
        PUBLIC_API_ENDPOINT: http://api-gateway:8080
    environment:
      DGIS_MAPGL_KEY: ${DGIS_MAPGL_KEY:-}
      PUBLIC_DADATA_API_KEY: ${PUBLIC_DADATA_API_KEY:-}
    depends_on:
      - api-gateway

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "4321:80"
    volumes:
      - ./local/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api-gateway

volumes:
  postgres_data:
  minio_data:
  jwt_keys:
