# Local replacement for prod/edge/nginx.conf.template: no domains, no TLS.
events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        # Dialog WebSocket goes through the gateway, which authenticates the accessToken cookie.
        location /api/v1/dialog/ {
            proxy_pass http://api-gateway:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization "Bearer $cookie_accessToken";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location = /api/v1/incidents/generate/stream {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 150s;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
