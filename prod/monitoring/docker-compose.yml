# Always-on prod monitoring stack (sim112-stable scraped from here).
# Grafana/Prometheus are intentionally NOT routed through the router VM/public domains - reach
# them over Tailscale at http://<vm-tailscale-ip>:3001 and :9090 (the VM at 192.168.1.170 isn't
# directly internet-facing anyway; the router only forwards :80/:443 for configured domains).
#
# Before first run, render prometheus.yml from the template:
#   set -a && . ./.env && set +a && envsubst < prometheus.yml.template > prometheus.yml
#
# Requires the external network created once:  docker network create prod-monitoring

services:
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: prod-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    networks:
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: prod-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prod-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
    depends_on:
      - node-exporter
      - cadvisor

  grafana:
    image: grafana/grafana:11.3.1
    container_name: prod-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring
    depends_on:
      - prometheus

networks:
  monitoring:
    external: true
    name: prod-monitoring

volumes:
  prometheus_data:
  grafana_data:
