syntax = "proto3";

package incident;

import "com/simulator112/incident/incident_context.proto";

option java_package = "com.simulator112.incident.grpc.contract";
option java_multiple_files = true;

service IncidentGrpcService {
  rpc GetIncidentContext(GetIncidentContextRequest) returns (LevelContext);
  rpc ResolveRouting(ResolveRoutingRequest) returns (RoutingResult);
}

message GetIncidentContextRequest {
  string level_id = 1;
}

message ResolveRoutingRequest {
  string classifier_code = 1;
  map<string, string> facts = 2;
}

message RoutingResult {
  string classifier_code = 1;
  string incident_type_name = 2;
  map<string, string> facts = 3;
  repeated RoutingDecision decisions = 4;
}

message RoutingDecision {
  DispatchService service = 1;
  string routing_target = 2;
  optional string matched_variant = 3;
  RoutingResultKind result_kind = 4;
  optional string target_type_name = 5;
}

enum RoutingResultKind {
  ROUTING_RESULT_KIND_UNSPECIFIED = 0;
  SEND_CARD = 1;
  SERVICE_TYPE = 2;
  NO_RESPONSE = 3;
  INFORMATION_ONLY = 4;
  RAW = 5;
}
