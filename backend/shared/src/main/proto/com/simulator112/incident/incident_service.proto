syntax = "proto3";

package incident;

import "com/simulator112/incident/incident_context.proto";

option java_package = "com.simulator112.incident.grpc.contract";
option java_multiple_files = true;

service IncidentGrpcService {
  rpc GetIncident(GetIncidentRequest) returns (IncidentContext);
  rpc GetLevel(GetLevelRequest) returns (LevelContext);
  rpc FindAvailableIncidents(FindAvailableIncidentsRequest) returns (FindAvailableIncidentsResponse);
}

message GetIncidentRequest {
  string incident_id = 1;
}

message GetLevelRequest {
  string level_id = 1;
}

message FindAvailableIncidentsRequest {
  IncidentTargetType target_type = 1;
  Difficulty difficulty = 2;
}

message FindAvailableIncidentsResponse {
  repeated IncidentContext incidents = 1;
}
