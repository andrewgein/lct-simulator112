syntax = "proto3";

package profile;

import "com/simulator112/profile/professional_profile.proto";

option java_package = "com.simulator112.profile.grpc.contract";
option java_multiple_files = true;

service UserProfileService {
  rpc GetProfessionalProfile(GetProfessionalProfileRequest) returns (ProfessionalProfile);
}

message GetProfessionalProfileRequest {
  string user_id = 1;
}
