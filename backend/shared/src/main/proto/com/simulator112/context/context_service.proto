syntax = "proto3";

package context;

import "google/protobuf/empty.proto";
import "com/simulator112/incident/incident_context.proto";

option java_package = "com.simulator112.context.grpc.contract";
option java_multiple_files = true;

message PersonInfo {
  string phone = 1;
  string contact_phone = 2;
  string last_name = 3;
  string first_name = 4;
  string middle_name = 5;
  string address = 6;
  string additional_info = 7;
  string on_scene_phone = 8;
  string status = 9;
}

enum DialogProgressStatus {
  DIALOG_PROGRESS_STATUS_UNSPECIFIED = 0;
  IDLE = 1;
  IN_CALL = 2;
  DISCONNECTED = 3;
  COMPLETED = 4;
}

message DialogProgress {
  string context_id = 1;
  string active_call_id = 2;
  DialogProgressStatus status = 3;
}

enum DdsStageSignal {
  DDS_STAGE_SIGNAL_UNSPECIFIED = 0;
  DDS_STAGE_SIGNAL_BRIGADE_ASSIGNED = 1;
  DDS_STAGE_SIGNAL_BRIGADE_STATUS_CHANGED = 2;
  DDS_STAGE_SIGNAL_STATUS_CALL_COMPLETED = 3;
  DDS_STAGE_SIGNAL_ADDITIONAL_SERVICE_REQUESTED = 4;
  DDS_STAGE_SIGNAL_INCIDENT_COMPLETED = 5;
}

enum ContextProgressStatus {
  CONTEXT_PROGRESS_STATUS_UNSPECIFIED = 0;
  CONTEXT_PROGRESS_STATUS_CREATED = 1;
  CONTEXT_PROGRESS_STATUS_FILLED = 2;
  CONTEXT_PROGRESS_STATUS_IN_REVIEW = 3;
  CONTEXT_PROGRESS_STATUS_DIALOG = 4;
  CONTEXT_PROGRESS_STATUS_DONE = 5;
}

enum IncidentProgressStatus {
  INCIDENT_PROGRESS_STATUS_UNSPECIFIED = 0;
  INCIDENT_PROGRESS_STATUS_PENDING = 1;
  INCIDENT_PROGRESS_STATUS_ACTIVE = 2;
  INCIDENT_PROGRESS_STATUS_COMPLETED = 3;
  INCIDENT_PROGRESS_STATUS_FAILED = 4;
}

message System112Progress {
  string active_call_id = 1;
  int32 completed_calls = 2;
  int32 total_calls = 3;
}

message DdsStageProgress {
  string stage_id = 1;
  string stage_type = 2;
  string status = 3;
  string started_at = 4;
  string deadline = 5;
}

message DdsProgress {
  string active_stage_id = 1;
  string deadline = 2;
  repeated DdsStageProgress stages = 3;
}

message IncidentProgress {
  string incident_id = 1;
  IncidentProgressStatus status = 2;
  oneof details {
    System112Progress system_112 = 3;
    DdsProgress dds = 4;
  }
}

message LevelProgress {
  string context_id = 1;
  incident.IncidentTargetType target_type = 2;
  incident.ExecutionMode execution_mode = 3;
  ContextProgressStatus status = 4;
  repeated IncidentProgress incidents = 5;
}

enum SpeakerType {
  USER = 0;
  LLM = 1;
}

message Phrase {
  SpeakerType speaker = 1;
  string text = 2;
}

message DialogContext {
  repeated Phrase transcript = 1;
}

message SolutionContext {
  PersonInfo applicant = 1;
  optional int32 victim_count = 2;
  map<string, string> additional_info = 3;
  repeated string incident_types = 4;
  string call_id = 5;
  string main_card_id = 6;
  reserved 7, 12;
  string revision_id = 8;
  string card_id = 9;
  string previous_revision_id = 10;
  int64 version = 11;
  string created_at = 13;
  optional bool additional_info_provided = 14;
  repeated string services = 15;
}

message AssignmentContext {
  reserved 1;
  string assignment_id = 2;
  string user_id = 3;
  string title = 4;
  incident.IncidentTargetType target_type = 5;
  incident.Difficulty difficulty = 6;
  incident.ExecutionMode execution_mode = 7;
  repeated incident.IncidentContext incidents = 8;
  optional int32 threshold_3 = 9;
  optional int32 threshold_4 = 10;
  optional int32 threshold_5 = 11;
}

message FullContext {
  string uuid = 1;
  string user_id = 2;
  incident.IncidentContext incident_context = 3;
  DialogContext dialog_context = 4;
  SolutionContext solution_context = 5;
  AssignmentContext assignment_context = 6;
  repeated SolutionContext solution_context_revisions = 7;
  LevelProgress level_progress = 8;
  string started_at = 9;
  string submitted_at = 10;
}

service ContextManagerService {
  rpc GetIncidentContext(GetIncidentContextRequest) returns (incident.IncidentContext);
  rpc AppendDialogContext(AppendDialogContextRequest) returns (google.protobuf.Empty);
  rpc AppendSolutionContext(AppendSolutionContextRequest) returns (google.protobuf.Empty);
  rpc GetFullContext(GetFullContextRequest) returns (FullContext);
  rpc GetNextCall(GetNextCallRequest) returns (incident.CallScenario);
  rpc GetCall(GetCallRequest) returns (incident.CallScenario);
  rpc GetDialogProgress(GetDialogProgressRequest) returns (DialogProgress);
  rpc StartCall(StartCallRequest) returns (DialogProgress);
  rpc CompleteCall(CompleteCallRequest) returns (DialogProgress);
  rpc DisconnectCall(DisconnectCallRequest) returns (DialogProgress);
  rpc GetCallTranscript(GetCallTranscriptRequest) returns (DialogContext);
  rpc ClearCallTranscript(ClearCallTranscriptRequest) returns (google.protobuf.Empty);
  rpc GetLevelProgress(GetLevelProgressRequest) returns (LevelProgress);
  rpc ApplyDdsStageSignal(ApplyDdsStageSignalRequest) returns (LevelProgress);
}

message GetIncidentContextRequest {
  string uuid = 1;
}

message AppendDialogContextRequest {
  string uuid = 1;
  DialogContext dialog_context = 2;
  string call_id = 3;
}

message AppendSolutionContextRequest {
  string uuid = 1;
  SolutionContext solution_context = 2;
}

message GetFullContextRequest {
  string uuid = 1;
}

message GetNextCallRequest {
  string uuid = 1;
  string current_call_id = 2;
}

message GetCallRequest {
  string context_id = 1;
  string call_id = 2;
}

message GetDialogProgressRequest {
  string context_id = 1;
}

message StartCallRequest {
  string context_id = 1;
  string call_id = 2;
}

message CompleteCallRequest {
  string context_id = 1;
  string call_id = 2;
}

message DisconnectCallRequest {
  string context_id = 1;
  string call_id = 2;
}

message GetCallTranscriptRequest {
  string context_id = 1;
  string call_id = 2;
}

message ClearCallTranscriptRequest {
  string context_id = 1;
  string call_id = 2;
}

message GetLevelProgressRequest {
  string context_id = 1;
}

message ApplyDdsStageSignalRequest {
  string context_id = 1;
  string incident_id = 2;
  DdsStageSignal signal = 3;
}
