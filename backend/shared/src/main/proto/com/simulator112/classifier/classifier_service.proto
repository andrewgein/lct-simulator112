syntax = "proto3";

package classifier;

import "com/simulator112/classifier/classifier.proto";

option java_package = "com.simulator112.classifier.grpc.contract";
option java_multiple_files = true;

service ClassifierService {
  rpc GetClassifierEntry(GetClassifierEntryRequest) returns (ClassifierEntry);
  rpc SearchClassifierEntries(SearchClassifierEntriesRequest) returns (SearchClassifierEntriesResponse);
  rpc ResolveRouting(ResolveRoutingRequest) returns (RoutingResult);
}

message GetClassifierEntryRequest {
  string classifier_code = 1;
}

message SearchClassifierEntriesRequest {
  string query = 1;
  int32 limit = 2;
  repeated string included_codes = 3;
}

message ClassifierCandidate {
  string code = 1;
  string category_name = 2;
  string final_name = 3;
}

message SearchClassifierEntriesResponse {
  repeated ClassifierCandidate entries = 1;
}

message ResolveRoutingRequest {
  string classifier_code = 1;
  map<string, string> facts = 2;
}
