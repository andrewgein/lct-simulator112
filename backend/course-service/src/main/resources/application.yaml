server:
  port: 8088

spring:
  application:
    name: course
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/course}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
  grpc:
    server:
      port: ${COURSE_GRPC_PORT:9095}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  servlet:
    multipart:
      max-file-size: ${MATERIAL_MAX_FILE_SIZE:25MB}
      max-request-size: ${MATERIAL_MAX_FILE_SIZE:25MB}

review:
  grpc:
    host: ${REVIEW_GRPC_HOST:localhost}
    port: ${REVIEW_GRPC_PORT:9094}

storage:
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:course-materials}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}

incident:
  grpc:
    host: ${INCIDENT_GRPC_HOST:localhost}
    port: ${INCIDENT_GRPC_PORT:9091}

classifier:
  grpc:
    host: ${CLASSIFIER_GRPC_HOST:localhost}
    port: ${CLASSIFIER_GRPC_PORT:9093}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
