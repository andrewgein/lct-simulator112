server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:

            #Auth service — управление пользователями администраторами
            - id: auth-service-admin-users
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/admin/users
              filters:
                - name: JwtAuthFilter
                - name: RoleAuthorization
                  args:
                    roles: ADMIN,SUPERVISOR

            #Auth service
            - id: auth-service-getrole
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/users/*/role
              filters:
                - name: JwtAuthFilter

            - id: auth-service-change-role
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/change-role/**
              filters:
                - name: JwtAuthFilter
                - name: RoleAuthorization
                  args:
                    roles: ADMIN

            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**

            #Profile service — чтение списка профилей преподавателями
            - id: profile-service-profiles-read
              uri: ${PROFILE_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/admin/profiles
                - Method=GET
              filters:
                - name: JwtAuthFilter
                - name: RoleAuthorization
                  args:
                    roles: ADMIN,SUPERVISOR

            #Profile service — назначение профессионального профиля администратором
            - id: profile-service-admin
              uri: ${PROFILE_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/admin/profiles,/api/v1/admin/profiles/**
              filters:
                - name: JwtAuthFilter
                - name: RoleAuthorization
                  args:
                    roles: ADMIN

            #Profile service — управление профилем
            - id: profile-service
              uri: ${PROFILE_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/profile/**
              filters:
                - name: JwtAuthFilter

            # Dialog service - authenticated WebSocket control and audio streams
            - id: dialog-service
              uri: ${DIALOG_SERVICE_URL:ws://localhost:8083}
              predicates:
                - Path=/api/v1/dialog/**
              filters:
                - name: JwtAuthFilter

            #Context manager - управление контекстом диалога
            - id: context-manager
              uri: ${CONTEXT_MANGER_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/context/**
              filters:
                - name: JwtAuthFilter


            #Review service - оценка результата
            - id: review-service
              uri: ${REVIEW_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/review/**
              filters:
                - name: JwtAuthFilter

            #Notification service - пользовательские уведомления
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/v1/notifications/**
              filters:
                - name: JwtAuthFilter

            #Classifier — справочник происшествий и маршрутизация
            - id: classifier-service
              uri: ${CLASSIFIER_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/v1/classifier/**
              filters:
                - name: JwtAuthFilter

            #Classifier — административное чтение справочника
            - id: classifier-service-admin
              uri: ${CLASSIFIER_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/v1/admin/classifier/**
              filters:
                - name: JwtAuthFilter
                - name: RoleAuthorization
                  args:
                    roles: ADMIN

            #Incident constructors — administrators and supervisors
            - id: incident-service-write
              uri: ${INCIDENT_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/incidents,/api/v1/incidents/**
                - Method=POST,PUT
              filters:
                - name: JwtAuthFilter
                - name: RoleAuthorization
                  args:
                    roles: ADMIN,SUPERVISOR

            #Course constructor — administrators and supervisors
            - id: course-service-write
              uri: ${COURSE_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/api/v1/courses,/api/v1/courses/**,/api/v1/study-groups,/api/v1/study-groups/**
                - Method=POST,PUT,DELETE
              filters:
                - name: JwtAuthFilter
                - name: RoleAuthorization
                  args:
                    roles: ADMIN,SUPERVISOR

            #Course catalog — authenticated users
            - id: course-service-read
              uri: ${COURSE_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/api/v1/courses,/api/v1/courses/**,/api/v1/study-groups,/api/v1/study-groups/**
                - Method=GET
              filters:
                - name: JwtAuthFilter

            #Course progress — the student's own enrollments
            - id: course-service-enrollments
              uri: ${COURSE_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/api/v1/enrollments,/api/v1/enrollments/**
              filters:
                - name: JwtAuthFilter

            #Incident catalog — authenticated users
            - id: incident-service-read
              uri: ${INCIDENT_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/incidents,/api/v1/incidents/**
                - Method=GET
              filters:
                - name: JwtAuthFilter

            #Admin service — monitoring overview, backups, audit log
            - id: admin-service-monitoring
              uri: ${ADMIN_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/api/v1/admin/monitoring/**
              filters:
                - name: JwtAuthFilter
                - name: RoleAuthorization
                  args:
                    roles: ADMIN

            - id: admin-service-backups
              uri: ${ADMIN_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/api/v1/admin/backups,/api/v1/admin/backups/**
              filters:
                - name: JwtAuthFilter
                - name: RoleAuthorization
                  args:
                    roles: ADMIN

            - id: admin-service-audit-logs
              uri: ${ADMIN_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/api/v1/admin/audit-logs,/api/v1/admin/audit-logs/**
              filters:
                - name: JwtAuthFilter
                - name: RoleAuthorization
                  args:
                    roles: ADMIN

            - id: admin-service-ops
              uri: ${ADMIN_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/api/v1/admin/ops,/api/v1/admin/ops/**
              filters:
                - name: JwtAuthFilter
                - name: RoleAuthorization
                  args:
                    roles: ADMIN

            - id: admin-service-settings
              uri: ${ADMIN_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/api/v1/admin/settings/**
              filters:
                - name: JwtAuthFilter
                - name: RoleAuthorization
                  args:
                    roles: ADMIN


          httpclient:
            websocket:
              max-frame-payload-length: 1048576

          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${rate-limit.replenish-rate}
                redis-rate-limiter.burstCapacity: ${rate-limit.burst-capacity}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        "[spring.json.add.type.headers]": false

jwt:
  public-key: ${JWT_PUBLIC_KEY_PATH}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

rate-limit:
  replenish-rate: ${RATE_LIMIT_REPLENISH:20}
  burst-capacity: ${RATE_LIMIT_BURST:40}

audit:
  # Only these path prefixes are logged (combined with a mutating HTTP method) - avoids flooding
  # the audit log with routine GET traffic. Kept in sync manually with the /api/v1/admin/** and
  # other RoleAuthorization-protected write routes above.
  logged-path-prefixes: /api/v1/admin/,/api/v1/auth/change-role/,/api/v1/incidents,/api/v1/courses,/api/v1/study-groups

logging:
  level:
    '[org.springframework.cloud.gateway]': INFO

management:
  endpoint:
    # /actuator/env is only reachable from inside the docker network (never routed through the
    # gateway's own proxy routes) - admin-service's settings viewer calls it directly by
    # container name. Spring's built-in Sanitizer still masks anything that looks like a
    # password/secret/token/key regardless of this setting.
    env:
      show-values: always
  endpoints:
    web:
      exposure:
        include: health,prometheus,env
