spring:
  datasource:
    url: jdbc:h2:mem:review;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  grpc:
    server:
      port: 0
  kafka:
    bootstrap-servers: localhost:9092
review:
  dialogue-analysis:
    base-url: http://localhost:8080
    model-name: rubert-tiny-bilingual-nli
    threshold: 0.8
  course-service:
    base-url: http://localhost:8088
