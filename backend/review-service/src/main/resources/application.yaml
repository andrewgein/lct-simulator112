server:
  port: 8085
spring:
  application:
    name: review-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/review}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  grpc:
    server:
      # 9092 занят Kafka, 9094 — gRPC profile-service при локальном запуске.
      port: ${GRPC_SERVER_PORT:9096}
  # в спринг бут 4 нет автоконфигурации кафки и не биндит spring.kafka.* сам 
  # bootstrap-servers читает вручную KafkaProducerConfiguration, сериализаторы заданы там же
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
review:
  dialogue-analysis:
    base-url: ${MLSERVER_URL:http://localhost:8080}
    model-name: ${MLSERVER_MODEL_NAME:rubert-tiny-bilingual-nli}
    threshold: ${MLSERVER_ENTAILMENT_THRESHOLD:0.8}
  course-service:
    grpc:
      host: ${COURSE_GRPC_HOST:localhost}
      port: ${COURSE_GRPC_PORT:9095}
  recommendation:
    base-url: ${LLM_BASE_URL:http://localhost:11434/v1}
    model: ${LLM_MODEL:gpt-oss-120b}
    api-key: ${LLM_API_KEY:}
  recordings:
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_RECORDINGS_BUCKET:call-recordings}
      access-key: ${S3_ACCESS_KEY:minioadmin}
      secret-key: ${S3_SECRET_KEY:minioadmin}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
