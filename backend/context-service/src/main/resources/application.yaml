server:
  port: 8084
spring:
  application:
    name: context-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/context}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
  grpc:
    server:
      port: 9090
    client:
      channel:
        incident-service:
          target: ${INCIDENT_SERVICE_GRPC_TARGET:static://localhost:9091}
        review-service:
          target: ${REVIEW_SERVICE_GRPC_TARGET:static://localhost:9092}
        course-service:
          target: ${COURSE_SERVICE_GRPC_TARGET:static://localhost:9095}
context:
  dds:
    timeout-check-delay-ms: ${DDS_TIMEOUT_CHECK_DELAY_MS:1000}
  cleanup:
    check-delay-ms: ${CONTEXT_CLEANUP_CHECK_DELAY_MS:3600000}
    abandoned-after-hours: ${CONTEXT_CLEANUP_ABANDONED_AFTER_HOURS:24}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
